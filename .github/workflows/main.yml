name: Test Linux Service Checker

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n src/check-services.sh

      - name: Make script executable
        run: chmod +x src/check-services.sh

      - name: Test missing service
        run: |
          set +e
          ./src/check-services.sh definitely-not-a-real-service
          exit_code=$?

          if [ "$exit_code" -ne 2 ]; then
            echo "Expected exit code 2, got $exit_code"
            exit 1
          fi
